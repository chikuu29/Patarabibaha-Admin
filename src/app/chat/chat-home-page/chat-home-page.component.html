<div class="chat-container-mobail">
  <div id="chat3" style="border-radius: 8px; ">
    <div class="p-3">

      <div class="input-group rounded mb-3 ">
        <input type="search" class="form-control rounded border p-3" [(ngModel)]="filterText" placeholder="Search"
          aria-label="Search" aria-describedby="search-addon" />
        <span class="input-group-text border-0" id="search-addon">
          <i class="fas fa-search"></i>
        </span>
      </div>

      <div data-mdb-perfect-scrollbar="true" class="user-holder" style="position: relative;height: 530px;   overflow-y: scroll;">
        <ul class="list-unstyled mb-0">
          <ng-container *ngFor="let connection of total_connection |fillter :['user_fname','user_lname']:filterText">
            <li class="p-2 border-bottom" style="cursor: pointer;" [routerLink]="'/chat/'+this.profile_id+'/chat_room/'+connection.connection_id  ">
              <a class="d-flex justify-content-between">
                <div class="d-flex flex-row">
                  <div>
                    <img [src]="'https://admin.choicemarriage.com/api/storage/'+connection.user_profile_image"
                      alt="avatar" class="d-flex align-self-center me-3 rounded" width="60">
                    <span class="badge bg-success badge-dot"></span>
                  </div>
                  <div class="pt-1">
                    <p class="fw-bold mb-0">{{connection.user_fname}}&nbsp;{{connection.user_lname}}</p>
                    <p class="small text-muted">Hello, Are you there?</p>
                  </div>
                </div>
                <div class="pt-1">
                  <p class="small text-muted mb-1">Just now</p>
                  <span class="badge bg-danger rounded-pill float-end">3</span>
                </div>
              </a>
            </li>
          </ng-container>


        </ul>
      </div>

    </div>
  </div>
</div>
