<div class="page-content">
    <div class="form-v9-content" style="background-image: url('../../../assets/img/form-v9.jpg')">
        <form class="form-detail" [formGroup]="admin">
            <h2>Registration Form</h2>
            <div class="form-row-total">
                <div class="form-row">
                    <input type="text" formControlName="name" name="full-name" id="full-name" class="input-text" placeholder="Subadmin Name" required>
                </div>
                <div class="form-row">
                    <input type="text" formControlName="email_id" name="your-email" id="your-email" class="input-text" placeholder="Subadmin Email" required pattern="[^@]+@[^@]+.[a-zA-Z]{2,6}">
                </div>
            </div>
            <div class="form-row-total">
                <div class="form-row">
                    <input type="text" formControlName="phone_number" name="Phone" id="Phone" class="input-text" placeholder="Phone Number" required>
                </div>
                <div class="form-row">
                    <input type="text" formControlName="UserId" name="User_Id" id="User_Id" class="input-text" placeholder="User Id" required>
                </div>
            </div>
            <div class="form-row-total">
                <div class="form-row">
                    <input type="password" formControlName="Password" name="password" id="password" class="input-text" placeholder="Your Password" required>
                </div>
                <div class="form-row">
                    <input type="password" name="comfirm-password" formControlName="conformpass" id="comfirm-password" class="input-text" placeholder="Comfirm Password" required>
                </div>
            </div>
            <div class="form-row-last">
                <input type="submit" (click)="createAdmin()" name="register" class="register" value="Register">
            </div>
        </form>
    </div>
</div>
