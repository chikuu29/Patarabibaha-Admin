
<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-titleb text-muted text-center"><button mat-flat-button color="accent" class="fw-bold">ADD STATE NAME</button></h4>
            <form [formGroup]="stategroup">
                <label >Select Country</label>
                <p-dropdown [options]="countryOption" [showClear]="true" optionLabel="name" [filter]="true"
                    placeholder="Select Country" [style]="{ width: '100%' }" formControlName="country_name"
                    optionValue="name" >
                    <ng-template pTemplate="selectedItem">
                        <div class="country-item country-item-value">
                            <div>
                                {{
                                stategroup.value.country_name || ""
                                }}
                            </div>
                        </div>
                    </ng-template>
                    <ng-template let-data pTemplate="item">
                        <div class="country-item">
                            <div>{{ data.name }}</div>
                        </div>
                    </ng-template>
                </p-dropdown>


                <label class="mt-2" for="inlineFormInputName2">State Name</label>
                <mat-form-field  appearance="outline" class="flex-fill w-100">
                    <mat-label>State name</mat-label>
                    <input matInput placeholder="State name" formControlName="name" type="text" />
                    <mat-error>Please Enter State Name</mat-error>
                </mat-form-field>
                <button type="submit" class="btn btn-primary  btn-lg mb-3 w-100"(click)="adddata()">{{button}}</button>
                <button type="submit" (click)="stategroup.reset();button='ADD'"
                    class="btn btn-danger  btn-lg mb-3 w-100" [hidden]="button=='ADD'">Cancle</button>

            </form>
        </div>
    </div>
</div>



<div class="col-lg grid-margin stretch-card">
    <div class="card">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table text-center">
                    <thead>
                        <tr>
                            <th>#SI</th>
                            <th>Country</th>
                            <th>State</th>
                            <th>Created At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let data of statealldata ; index as i">

                            <td>{{i+1}}</td>
                            <td>{{data.country_name}}</td>
                            <td>{{data.name}}</td>
                            <td>{{data.created_At | date}}</td>
                            <td>
                                <p class="badge badge-danger" *ngIf="data.status == 0">
                                    NOT PUBLISHED
                                </p>
                                <p class="badge badge-success" *ngIf="data.status == 1">PUBLISHED</p>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-warning btn-fw me-2" (click)="edit(data.id)">Edit</button>
                                <button type="button" class="btn btn-outline-danger btn-fw">Delete</button>


                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
