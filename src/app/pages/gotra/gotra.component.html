<div class="mb-3">
  <div class="card">
    <div class="card-body">
      <h4 class="card-titleb text-muted">ADD GOTRA NAME</h4>
      <form class="form-inline" [formGroup]="gotragroup">
        <label class="sr-only" for="inlineFormInputName2">Name</label>
        <mat-form-field isReadonly appearance="outline" class="flex-fill w-100">
          <mat-label>Gotra name</mat-label>
          <input matInput placeholder="Gotra name" formControlName="name" type="text" />
          <mat-error>Please Enter Gotra Name</mat-error>
        </mat-form-field>
        <button type="submit" (click)="addCountry()" class="btn btn-primary  btn-lg mb-3 w-100">{{button}}</button>
        <button type="submit" (click)="gotragroup.reset();button='ADD'" class="btn btn-danger  btn-lg mb-3 w-100"
          [hidden]="button=='ADD'">Cancle</button>

      </form>
    </div>
  </div>
</div>

<div class="outline">
  <div class="commen">
    <button (click)="publishuser()" type="button" [style]="{ 'background-color': '#009788', 'color': '#FFFFFF' }"
      class="btn">
      <i class="fas fa-upload"></i> Publish
    </button>
  </div>
  <div class="commen">
    <button type="button" (click)="unpublishuser()" [style]="{ 'background-color': '#F47F16', 'color': '#FFFFFF' }"
      class="btn">
      <i class="fas fa-download"></i> Unpublish
    </button>
  </div>
  <div class="commen">
    <button (click)="deletedata()" [style]="{ 'background-color': '#FF1A0A', 'color': '#FFFFFF' }" type="button"
      class="btn">
      <i class="fas fa-trash-alt"></i> Delete
    </button>
  </div>
</div>
<div class="row">
  <div class="col-xl-12 order-lg-1 order-xl-1">
    <div class="table-holder kt-portlet kt-portlet--height-fluid  ">
      <div class="table-caption-holder">
        <div class="dropdown-container">
          <select id="dropdown" (change)="changepaginetdata($event)">
            <option *ngFor="let option of options" [value]="option">{{ option }}</option>
          </select>
        </div>
        <div class="kt-portlet__head-toolbar">
          <app-search (getSerachText)="getSearchText($event)" [search_btn]="true" [fillter_btn]="false"
            (clickSearch)="search($event)" (clickFillter)="fillter($event)"></app-search>
        </div>
      </div>
      <div class="table-content-holder kt-portlet__body kt-portlet__body--fit ps ps--active-y" id="grid_scroll_body"
        style="max-height: 100vh; position: relative;">
        <div class="inbox-body inbox-body-table">
          <div class="table-scroll">
            <table class="custom-table table  table-bordered table-striped">
              <thead class="flip-content">
                <tr>
                  <th style="cursor: pointer; width:5%" title="Select Member">
                    <input type="checkbox" name="" id="all" (change)="checkAll($event)">
                  </th>
                  <th style="cursor: pointer;width:1%">#SI</th>
                  <th style="cursor: pointer; width:25%">Gotra Name</th>
                  <th style="cursor: pointer; width:25%">Created in</th>
                  <th style="cursor: pointer; width:25%">Status</th>
                  <th style="cursor: pointer; width:25%">Action</th>
                  <!-- class="fixed-column" -->
                </tr>
              </thead>
              <tbody>
                <ng-container
                  *ngFor="let data of tableData | fillter:['name']:filterText ; index as i">
                  <tr>
                    <td class="text-center">
                      <input type="checkbox" class="check" [value]="data?.user_id" (change)="getId(data?.id,$event)"
                        name="" id="">
                    </td>
                    <td>{{ i+1 }}</td>
                    <td [title]="data?.cast_name">{{ data?.name }}</td>
                    <td [title]="data?.created_At">
                      <div class="btn btn-bold btn-sm btn-font-sm btn-label-danger dueLabel"> {{data?.created_At |
                        date:'medium' }} </div>
                    </td>
                    <td title="Due In 9 Days">
                      <div class="btn btn-bold btn-sm btn-font-sm btn-label-danger dueLabel" *ngIf="data.status == 0">
                        NOT PUBLISHED
                      </div>
                      <div class="btn btn-bold btn-sm btn-font-sm btn-label-success dueLabel" *ngIf="data.status == 1">
                        PUBLISHED
                      </div>
                    </td>
                    <td>
                      <button type="submit" (click)="update(data.id)"
                        class="btn btn-outline-primary btn-sm">Edit</button>
                      <!-- <button type="submit" (click)="deleted(data.id)"
                      class="btn btn-outline-primary btn-sm">Delete</button>
                      <button type="submit" class="btn btn-outline-primary btn-sm"
                        (click)="publish(data.id,data.status)">{{ data.status == 1
                        ?'PUBLISHED': 'UNPUBLISHED' }}</button> -->
                    </td>
                  </tr>
                </ng-container>


              </tbody>
            </table>
          </div>

        </div>

      </div>
      <div class="table-footer-holder">
        <div>
          <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [maxSize]="10" [rotate]="false"
            [ellipses]="false" [boundaryLinks]="false" class="" (pageChange)="onpageChnage()"></ngb-pagination>
        </div>
        <div>
          <span style="white-space: nowrap; padding-right: 20px;font-weight: bold;">Showing Record's
            {{offset}} to {{totalFetchrecord}} of
            {{totalDataCount}}</span>
        </div>

      </div>
    </div>
  </div>
</div>
