<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title text-center">SET USER PREFIX ID</h4>
            <form  [formGroup]="prifixgroup">
                <mat-form-field isReadonly appearance="outline" class="flex-fill w-100">
                    <mat-label>Prefix name</mat-label>
                    <input matInput placeholder="Countrie name" formControlName="prefix_id_name" type="text" />
                    <mat-error>Please Enter Prefix Name</mat-error>
                </mat-form-field>
                <!-- <div class=""> -->
                    <button mat-raised-button color="primary" class="me-2" (click)="update()" >Update</button>
                <!-- </div> -->
            </form>
        </div>
    </div>
</div>
