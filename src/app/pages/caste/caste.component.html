<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Cast</h4>
            <!-- <p class="card-description"> Use the <code>.form-inline</code> class to display a series of labels, form
                controls, and buttons on a single horizontal row </p> -->
            <form class="form-inline" [formGroup]="cast">
                <label class="sr-only" for="inlineFormInputName2">Name</label>
                <input type="text" class="form-control mb-2 mr-sm-2" id="inlineFormInputName2"
                    formControlName="cast_name" placeholder="Cast">
                <label class="sr-only" for="inlineFormInputGroupUsername2">Username</label>
                <!-- <div class="input-group mb-2 mr-sm-2">
                    <div class="input-group-prepend">
                        <div class="input-group-text">@</div>
                    </div>
                    <input type="text" class="form-control" id="inlineFormInputGroupUsername2" placeholder="Username">
                </div> -->
                <div class="form-check mx-sm-2">
                    <!-- <label class="form-check-label"> -->
                    <!-- <input type="checkbox" class="form-check-input" checked> Remember me </label>  -->
                </div>
                <button type="submit" (click)="public()" class="btn btn-primary mb-2">{{ button }}</button>
            </form>
        </div>
    </div>
</div>
<!-- <div> Per Page: <select>

        <option *ngFor="let size of pageSizes" [ngValue]="size" (change)="onTableSizeChange($event)">
            {{ size }}
        </option>
    </select>
</div> -->
<div class="">
    <div class="table-holder">
        <div class="caption-header">
            <div class="caption-item">
                <i class="fa-solid fa-chart-simple me-2 text-primary fs-5"></i>
                <span class="fs-5">Showing {{tabledata.length}} of {{tabledata.length}} results</span>
            </div>
            <!-- Search Start -->
            <div class="search">
                <input type="text" [(ngModel)]="filterText" placeholder="Filter by any column" />
                <div class="symbol">
                    <svg class="cloud">
                        <use xlink:href="#cloud" />
                    </svg>
                    <svg class="lens">
                        <use xlink:href="#lens" />
                    </svg>
                </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
                <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" id="cloud">
                    <path d="M31.714,25.543c3.335-2.17,4.27-6.612,2.084-9.922c-1.247-1.884-3.31-3.077-5.575-3.223h-0.021
                  C27.148,6.68,21.624,2.89,15.862,3.931c-3.308,0.597-6.134,2.715-7.618,5.708c-4.763,0.2-8.46,4.194-8.257,8.919
                  c0.202,4.726,4.227,8.392,8.991,8.192h4.873h13.934C27.784,26.751,30.252,26.54,31.714,25.543z" />
                </symbol>
                <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" id="lens">
                    <path d="M15.656,13.692l-3.257-3.229c2.087-3.079,1.261-7.252-1.845-9.321c-3.106-2.068-7.315-1.25-9.402,1.83
                  s-1.261,7.252,1.845,9.32c1.123,0.748,2.446,1.146,3.799,1.142c1.273-0.016,2.515-0.39,3.583-1.076l3.257,3.229
                  c0.531,0.541,1.404,0.553,1.95,0.025c0.009-0.008,0.018-0.017,0.026-0.025C16.112,15.059,16.131,14.242,15.656,13.692z M2.845,6.631
                  c0.023-2.188,1.832-3.942,4.039-3.918c2.206,0.024,3.976,1.816,3.951,4.004c-0.023,2.171-1.805,3.918-3.995,3.918
                  C4.622,10.623,2.833,8.831,2.845,6.631L2.845,6.631z" />
                </symbol>
            </svg>
            <!-- Search End -->
        </div>
        <div class="mt-3 data-view-container">
            <table class="table">
                <thead class="table-header">
                    <tr>
                        <!-- <th>
                            <input type="checkbox" class="">
                        </th> -->
                        <th>#SI</th>
                        <th>Cast</th>
                        <th>Created in</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody class="table-body table-striped">
                    <tr *ngFor="let countryalldatahtml of tabledata | fillter :['cast_name']:filterText ; index as i">
                        <!-- <th>
                            <input type="checkbox" class="">
                        </th> -->
                        <td>{{i+1}}</td>
                        <td>{{countryalldatahtml.cast_name}}</td>
                        <td>{{ countryalldatahtml.createdon}}</td>
                        <td>
                            <p class="badge badge-danger" *ngIf="countryalldatahtml.status == 0">
                                NOT PUBLISHED
                            </p>
                            <p class="badge badge-success" *ngIf="countryalldatahtml.status == 1">PUBLISHED</p>
                        </td>
                        <td>
                            <!-- <input type="button" value="Edit" (click)="update(countryalldatahtml.id)"> -->
                            <button type="submit" (click)="update(countryalldatahtml.id)"
                            class="btn btn-outline-warning btn-fw me-2 w-10">Edit</button>
                            <button type="submit" (click)="deleted(countryalldatahtml.id)"
                            class="btn btn-outline-danger btn-fw me-2 w-10">Delete</button>
                            <button type="submit"
                            class="btn btn-outline-success btn-fw w-10" (click)="publish(countryalldatahtml.id,countryalldatahtml.status)" >{{ countryalldatahtml.status == 1 ?'PUBLISHED': 'UNPUBLISHED' }}</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
