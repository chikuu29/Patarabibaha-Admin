<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <form [formGroup]="citygroup">
                <label for="exampleSelectGender">COUNTRY</label>
                <p-dropdown (onChange)="getstatefilter()" [options]="countryOption" [showClear]="true" optionLabel="name" [filter]="true"
                    placeholder="Select Country" [style]="{ width: '100%' }" formControlName="country_name"
                    optionValue="name" >
                    <ng-template pTemplate="selectedItem">
                        <div class="country-item country-item-value">
                            <div>
                                {{
                                    citygroup.value.country_name || ""
                                }}
                            </div>
                        </div>
                    </ng-template>
                    <ng-template let-data pTemplate="item">
                        <div class="country-item">
                            <div>{{ data.name }}</div>
                        </div>
                    </ng-template>
                </p-dropdown>





                <!-- <div class="form-group col-md-4">

                        <option hidden [value]="'0'">SELECT</option>
                        <option *ngFor="let countryalldatahtml of countryalldata" [value]="countryalldatahtml.name">
                            {{countryalldatahtml.name}}</option>
                    </select>
                </div> -->
                <label for="exampleSelectGender">STATE</label>
                <p-dropdown  [options]="stateOption" [showClear]="true" optionLabel="name" [filter]="true"
                placeholder="Select Country" [style]="{ width: '100%' }" formControlName="state_name"
                optionValue="name" >
                <ng-template pTemplate="selectedItem">
                    <div class="country-item country-item-value">
                        <div>
                            {{
                                citygroup.value.state_name || ""
                            }}
                        </div>
                    </div>
                </ng-template>
                <ng-template let-data pTemplate="item">
                    <div class="country-item">
                        <div>{{ data.name }}</div>
                    </div>
                </ng-template>
            </p-dropdown>







                <!-- <div class="form-group col-md-4">
                    
                    <select class="form-control" name="exampleSelectGender1" formControlName="state_name"
                        ngDefaultControl id="exampleSelectGender1">
                        (change)="filterstate()" [(ngModel)]="countryid"

                        <option *ngFor="let countryalldatahtml of statealldatabycountry"

                    </select>
                </div> -->
                <label class="card-title">CITY</label>
                <!-- <p class="card-description"> Use the <code>.form-inline</code> class to display a series of labels, form controls, and buttons on a single horizontal row </p> -->

                <label class="sr-only" for="inlineFormInputName2">Name</label>
                <input type="text" class="form-control mb-2 mr-sm-2" formControlName="name" id="inlineFormInputName2"
                    placeholder="city name">
                <!-- (keyup)="statefilter()"  [(ngModel)]="state"-->
                <label class="sr-only" for="inlineFormInputGroupUsername2">Username</label>
                <div class="input-group mb-2 mr-sm-2">
                    <div class="input-group-prepend">
                        <!-- <div class="input-group-text">@</div> -->
                    </div>
                    <!-- <input type="text" class="form-control" id="inlineFormInputGroupUsername2" placeholder="Username"> -->
                </div>
                <div class="form-check mx-sm-2">
                    <!-- <label class="form-check-label">
              <input type="checkbox" class="form-check-input" checked> Remember me </label> -->
                </div>
                <button type="submit" (click)="adddata()" class="btn btn-primary mb-2">{{ button }}</button>
            </form>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <!-- <h4 class="card-title">Basic Table</h4>
                <p class="card-description"> Add class <code>.table</code> -->
                <!-- </p> -->
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" class="checkbox">
                                    <!-- (click)="checkall($event)" -->
                                </th>
                                <th>#SI</th>
                                <th>City Name</th>
                                <th>Created in</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let statealldatahtml of allcitydata ; index as i">
                                <th>
                                    <input type="checkbox" class="checkbox">
                                </th>
                                <td>{{i+1}}</td>
                                <td>{{statealldatahtml.name}}</td>
                                <td>{{ statealldatahtml.time_stamp }}</td>
                                <td>
                                    <p class="badge badge-danger" *ngIf="statealldatahtml.status == 0">
                                        NOT PUBLISHED
                                    </p>
                                    <p class="badge badge-success" *ngIf="statealldatahtml.status == 1">PUBLISHED</p>
                                </td>
                                <td>
                                    <input type="button" (click)="update(statealldatahtml.id)" value="Edit">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
