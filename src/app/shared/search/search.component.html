<!-- Search Start -->
<div class="d-flex gap-2 align-items-center ps-3">
    <ng-container *ngIf="fillter_btn">
        <ng-container *ngIf="!btnWithText">
            <!-- <p-button icon="pi pi-filter" style="font-size: 2rem;" severity="success"></p-button> -->
            <button class="filter-button" (click)="clickFillterMethod(filterText)">
                <i class="fas fa-filter"></i>
            </button>
        </ng-container>
        <!-- Filter Button -->
        <ng-container *ngIf="btnWithText">
            <button type="button" class="btn btn-outline-primary" (click)="clickFillterMethod(filterText)">
                <i class="fas fa-filter"></i> Filter
            </button>
        </ng-container>
    </ng-container>
    <ng-container>
        <div class="search-input " [ngClass]="cls" style="  box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;">
            <input type="text" (keyup)="changeSearchText(filterText)" [(ngModel)]="filterText"
                placeholder="Filter by any column" />
            <div class="symbol">
                <svg class="cloud">
                    <use xlink:href="#cloud" />
                </svg>
                <svg class="lens">
                    <use xlink:href="#lens" />
                </svg>
            </div>
        </div>


    </ng-container>
    <ng-container *ngIf="search_btn">
        <ng-container *ngIf="!btnWithText">
            <div class="search-button" (click)="clickSearchMethod(filterText)">
                <input type="text" [(ngModel)]="filterText" placeholder="Filter by any column" />
                <div class="symbol">
                    <svg class="cloud">
                        <use xlink:href="#cloud" />
                    </svg>
                    <svg class="lens">
                        <use xlink:href="#lens" />
                    </svg>
                </div>
            </div>
        </ng-container>
        <ng-container *ngIf="btnWithText">
            <button type="button" class="btn btn-outline-primary">
                <i class="fas fa-search"></i> Search
            </button>
        </ng-container>



    </ng-container>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" id="cloud">
            <path d="M31.714,25.543c3.335-2.17,4.27-6.612,2.084-9.922c-1.247-1.884-3.31-3.077-5.575-3.223h-0.021
  C27.148,6.68,21.624,2.89,15.862,3.931c-3.308,0.597-6.134,2.715-7.618,5.708c-4.763,0.2-8.46,4.194-8.257,8.919
  c0.202,4.726,4.227,8.392,8.991,8.192h4.873h13.934C27.784,26.751,30.252,26.54,31.714,25.543z" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" id="lens">
            <path d="M15.656,13.692l-3.257-3.229c2.087-3.079,1.261-7.252-1.845-9.321c-3.106-2.068-7.315-1.25-9.402,1.83
  s-1.261,7.252,1.845,9.32c1.123,0.748,2.446,1.146,3.799,1.142c1.273-0.016,2.515-0.39,3.583-1.076l3.257,3.229
  c0.531,0.541,1.404,0.553,1.95,0.025c0.009-0.008,0.018-0.017,0.026-0.025C16.112,15.059,16.131,14.242,15.656,13.692z M2.845,6.631
  c0.023-2.188,1.832-3.942,4.039-3.918c2.206,0.024,3.976,1.816,3.951,4.004c-0.023,2.171-1.805,3.918-3.995,3.918
  C4.622,10.623,2.833,8.831,2.845,6.631L2.845,6.631z" />
        </symbol>
    </svg>
</div>
<!-- Search End -->
