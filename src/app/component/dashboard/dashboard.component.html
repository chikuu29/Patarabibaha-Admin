
<div class="row">
    <div class="col-12 grid-margin stretch-card" >
        <div class="card corona-gradient-card" style="background-color: #f91f06;">
            <div class="card-body py-0 px-0 px-sm-3">
                <div class="row align-items-center">
                    <div class="col-4 col-sm-3 col-xl-2">
                        <img src="assets/images/dashboard/Group126@2x.png" class="gradient-corona-img img-fluid" alt="">
                    </div>
                    <div class="col-5 col-sm-7 col-xl-8 p-0">
                        <h4 class="mb-1 mb-sm-0">Want even more features?</h4>
                        <p class="mb-0 font-weight-normal d-none d-sm-block">Check out our Pro version with 5
                            unique layouts!</p>
                    </div>
                    <div class="col-3 col-sm-2 col-xl-2 pl-0 text-center">
                        <span>
                            <a href="https://www.bootstrapdash.com/product/corona-admin-template/" target="_blank"
                                class="btn btn-outline-light btn-rounded get-started-btn">Upgrade to PRO</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="main-pane p-0">
    <div class="container-fluid content-wrapper p-0">
       
        <div class="row">
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">{{allUserCount}}</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+3.5%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success ">
                                    <i class="fa-solid fa-user" ></i>
                                    <!-- <span class="mdi mdi-arrow-top-right icon-item"></span> -->
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">All Members</h6>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">0</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+11%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success">
                                    <i class="fa-solid fa-user"
                                        style="--fa-primary-color: #050505; --fa-secondary-color: #11e462;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Active Members</h6>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">0</h3>
                                    <!-- <p class="text-danger ml-2 mb-0 font-weight-medium">-2.4%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-danger">
                                    <i class="fa-solid fa-user-plus" style="color: #f91f06;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Paid Members</h6>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">0</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+3.5%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success ">
                                    <i class="fa-solid fa-users" style="color: #005af5;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Featured Members</h6>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <h3 class="text-light text-muted mb-5">Recent Members </h3>
    <div class="container-fluid data-view-container">
        <div class="row">

            <div class="w-100 grid grid-cols-2 gap-3 sm:gap-5 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">

            <ng-container *ngFor="let user of userInfoDATA">
                <div class="relative product-container">
                    <div class=" cursor-pointer overflow-hidden transition-all duration-300 ">
                        <div
                            class="overflow-clip rounded-md lg:rounded-xl flex flex-col justify-between relative flex-1">
                            <div class="relative flex items-center justify-center overflow-hidden rounded-t-lg flex-1 flex-col"
                            [routerLink]="'/user/'+user.user_id">
                                <div class=" relative w-full aspect-square product-img-container ">
                                    <div class="w-full h-full bg-cover product-img "
                                        style="z-index: 0; background-image: url('{{image +user.user_profile_image}}');background-repeat: no-repeat;background-size: cover">
                                    </div>
                                </div>
                            </div>
                            <div class="py-1 lg:py-2 bg-white rounded-b-lg flex flex-col justify-between ">
                                <div class="px-1 lg:px-2 mb-2">
                                    <button mat-button color="accent" class="w-100 mb-2 text-wrap" style="width: 6rem;">{{user?.user_fname |uppercase}}&nbsp;{{user?.user_lname
                                        |uppercase}} </button>
                                    <!-- <h1 class="text-12px text-14px text-16px font-semibold line-clamp-2 h-36px sm:h-[40px] text-center fw-bold mt-3 text-wrap"
                                        style="color: #8a6d3b; size: 10px;">{{user?.user_fname |uppercase}}&nbsp;{{user?.user_lname
                                        |uppercase}}</h1> -->
                                    <button mat-raised-button color="accent" class="w-100">Details</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-container>
            </div>


        </div>
    </div>
</div>
