<app-graph-data-view></app-graph-data-view>
<div class="main-pane p-0">
    <div class="container-fluid content-wrapper p-0">
        <div class="row">
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card" (click)="laodMemberInfo('Inactive')">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">{{allInactiveUser}}</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+3.5%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success ">
                                    <i class="fa-solid fa-users"></i>
                                    <!-- <span class="mdi mdi-arrow-top-right icon-item"></span> -->
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">All Recent Register Members</h6>
                        <ng-container *ngIf="allInactiveUserClick">
                            <mat-progress-bar mode="indeterminate" [color]="'accent'"></mat-progress-bar>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card" (click)="laodMemberInfo('Approved')">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">{{allApprovedUser}}</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+11%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success">
                                    <i class="fa-solid fa-thumbs-up"
                                        style="--fa-primary-color: #050505; --fa-secondary-color: #e41111;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Approved Members</h6>
                        <ng-container *ngIf="allApprovedUserClick">
                            <mat-progress-bar mode="indeterminate" [color]="'accent'"></mat-progress-bar>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card" (click)="laodMemberInfo('Paid')">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">{{allPaidUser}}</h3>
                                    <!-- <p class="text-danger ml-2 mb-0 font-weight-medium">-2.4%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-warning">
                                    <i class="fa-solid fa-crown" style="color: #f91f06;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Paid Members</h6>
                        <ng-container *ngIf="allPaidUsrClick">
                            <mat-progress-bar mode="indeterminate" [color]="'accent'"></mat-progress-bar>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-sm-6 grid-margin stretch-card curser-pointer">
                <div class="card" (click)="laodMemberInfo('All')">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-9">
                                <div class="d-flex align-items-center align-self-start">
                                    <h3 class="mb-0">{{allUserCount}}</h3>
                                    <!-- <p class="text-success ml-2 mb-0 font-weight-medium">+3.5%</p> -->
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="icon icon-box-success ">
                                    <i class="fa-solid fa-users" style="color: #005af5;"></i>
                                </div>
                            </div>
                        </div>
                        <h6 class="text-muted font-weight-normal">Total Members</h6>
                        <ng-container *ngIf="allUserClick">
                            <mat-progress-bar mode="indeterminate" [color]="'accent'"></mat-progress-bar>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex justify-between align-items-center">
        <div>
            <h3 class="text-light text-muted mb-5">{{user_data_message}} </h3>
        </div>
        <div>
            <!-- Search Start -->
            <div class="search">
                <input type="text" [(ngModel)]="filterText" placeholder="Filter by any column" />
                <div class="symbol">
                    <svg class="cloud">
                        <use xlink:href="#cloud" />
                    </svg>
                    <svg class="lens">
                        <use xlink:href="#lens" />
                    </svg>
                </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
                <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 35" id="cloud">
                    <path d="M31.714,25.543c3.335-2.17,4.27-6.612,2.084-9.922c-1.247-1.884-3.31-3.077-5.575-3.223h-0.021
      C27.148,6.68,21.624,2.89,15.862,3.931c-3.308,0.597-6.134,2.715-7.618,5.708c-4.763,0.2-8.46,4.194-8.257,8.919
      c0.202,4.726,4.227,8.392,8.991,8.192h4.873h13.934C27.784,26.751,30.252,26.54,31.714,25.543z" />
                </symbol>
                <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" id="lens">
                    <path d="M15.656,13.692l-3.257-3.229c2.087-3.079,1.261-7.252-1.845-9.321c-3.106-2.068-7.315-1.25-9.402,1.83
      s-1.261,7.252,1.845,9.32c1.123,0.748,2.446,1.146,3.799,1.142c1.273-0.016,2.515-0.39,3.583-1.076l3.257,3.229
      c0.531,0.541,1.404,0.553,1.95,0.025c0.009-0.008,0.018-0.017,0.026-0.025C16.112,15.059,16.131,14.242,15.656,13.692z M2.845,6.631
      c0.023-2.188,1.832-3.942,4.039-3.918c2.206,0.024,3.976,1.816,3.951,4.004c-0.023,2.171-1.805,3.918-3.995,3.918
      C4.622,10.623,2.833,8.831,2.845,6.631L2.845,6.631z" />
                </symbol>
            </svg>
            <!-- Search End -->
        </div>
    </div>


    <div class="container-fluid data-view-container">
        <div class="row">

            <div class="w-100 grid grid-cols-2 gap-3 sm:gap-5 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">

                <ng-container *ngFor="let user of userInfoDATA |fillter :['user_id','user_fname','user_lname']:filterText">
                    <div class="relative product-container">
                        <div class=" cursor-pointer overflow-hidden transition-all duration-300 ">
                            <div
                                class="overflow-clip rounded-md lg:rounded-xl flex flex-col justify-between relative flex-1">
                                <div class="relative flex items-center justify-center overflow-hidden rounded-t-lg flex-1 flex-col"
                                    [routerLink]="'/user/'+user.user_id">
                                    <div class=" relative w-full aspect-square product-img-container ">
                                        <div class="w-full h-full bg-cover product-img "
                                            style="z-index: 0; background-image: url('{{image +user.user_profile_image}}');background-repeat: no-repeat;background-size: cover">
                                        </div>
                                    </div>
                                </div>
                                <div class="py-1 lg:py-2 bg-white rounded-b-lg flex flex-col justify-between ">
                                    <div class="px-1 lg:px-2 mb-2">
                                        <button mat-button color="accent" class="w-100 mb-2 text-wrap"
                                            style="width: 6rem;">{{user?.user_fname |uppercase}}&nbsp;{{user?.user_lname
                                            |uppercase}} </button>
                                        <!-- <h1 class="text-12px text-14px text-16px font-semibold line-clamp-2 h-36px sm:h-[40px] text-center fw-bold mt-3 text-wrap"
                                        style="color: #8a6d3b; size: 10px;">{{user?.user_fname |uppercase}}&nbsp;{{user?.user_lname
                                        |uppercase}}</h1> -->
                                        <button mat-raised-button color="accent" class="w-100">Details</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>


        </div>
        <ng-container *ngIf="userInfoDATA.length==0">
            <p class="text-center text-danger fs-5">No Data Found</p>
        </ng-container>
    </div>
</div>
