<div class="flex-container">

    <div class="flex-item ">
        <div class="h-md-100 dash-card p-3 item">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button mat-flat-button color="">Total Users</button>
                <button mat-flat-button color="primary">{{userCount}}</button>
            </div>
            <div class="d-flex justify-content-center align-items-center card-body">
                <div class="col-12">
                    <p-chart type="line" [data]="basicData" [options]="basicOptions" [responsive]="true"
                        height="150px"></p-chart>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-item ">
        <div class="h-md-100 dash-card p-3 item">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button mat-flat-button color="">Total Customers</button>
                <button mat-flat-button color="primary">{{customerCoute}}</button>
            </div>
            <div class="d-flex justify-content-center align-items-center card-body">
                <div class="col-12">
                    <!-- <p-chart type="line" [data]="basicDataForCustomer" [options]="basicOptions" [responsive]="true"
                        height="150px"></p-chart> -->
                        <p-chart type="bar" [data]="basicDataForCustomer" [options]="basicOptions" [responsive]="true"
                        height="150px"></p-chart>
                </div>
            </div>
        </div>
    </div>
    <div class="flex-item ">
        <div class="h-md-100 dash-card p-3 item">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button mat-flat-button color="text-success">Total Member</button>
                <button mat-flat-button color="primary">{{totalcaseCount}}</button>
            </div>
            <div class="d-flex justify-content-center align-items-center card-body">
                <div class="col-6 d-flex">
                    <p-chart type="pie" [data]="paiChartCasedata" [options]="basicOptions" height="150px"></p-chart>
                </div>
                <div class="col-6 text-center">
                    <button mat-flat-button color="" class="text-success  w-100 mb-2">Paid
                        {{freeMemberCount}}</button>
                    <button mat-flat-button color="warn" class="mb-2  w-100">Free
                        {{paidMemberCount}}</button>
                    <!-- <button mat-stroked-button color="warn" class="mb-1 w-100">Pending {{paidMemberCount}}</button> -->


                </div>
            </div>

        </div>
    </div>


</div>
