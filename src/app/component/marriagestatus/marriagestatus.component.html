<div class="">
  <div class="table-holder">
    <div class="caption-header">
      <div class="caption-item">
        <app-search (getSerachText)="getSearchText($event)" [search_btn]="true"
          (clickSearch)="search($event)"></app-search>
      </div>
      <div class="caption-item mt-3" *ngIf="pegination_required">

        <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [maxSize]="3" [rotate]="true"
          [ellipses]="false" [boundaryLinks]="false" class="" size="lg" (pageChange)="onpageChnage()"></ngb-pagination>
      </div>
    </div>

    <div class="mt-3 data-view-container">
      <table class="table ">
        <thead class="table-header">
          <tr>
            <th>
              <input type="checkbox" class="checkAll" id="all" (change)="checkAll($event)">
            </th>
            <th class="width"></th>
            <th>#SI</th>
            <th>User Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Id</th>
            <th>Created At</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody class="table-body table-striped">
          <ng-container
            *ngFor="let data of finaldata | fillter:['user_fname','user_id','user_email','auth_phone_no']:filterText ; index as i">
            <tr>
              <td>
                <input type="checkbox" class="check" (change)="getId(data?.Id,$event)" [value]="data?.user_id">
              </td>
              <td class="width">
                <p title="Online" class="badge badge-success" *ngIf="data.online_status == 1">
                  <span></span>
                </p>
                <p title="Offline" class="badge badge-danger" *ngIf="data.online_status == 0">
                  <span></span>
                </p>
              </td>
              <td>{{i+1}}</td>
              <td> <a (click)="userpage(data?.user_id)" class="underline" href="javascript:void(0);">
                  {{data?.user_fname+' '+data?.user_lname }}
                </a> </td>
              <td>{{data.user_dob | age}}</td>
              <td>{{data.user_gender }}</td>
              <td>{{data.user_id }}</td>
              <td>{{data.user_creation_date_time | date}}</td>
              <td>
                <button type="button" (click)="combine(data?.user_id)"
                  [class]="'btn btn-outline-success btn-fw me-2 w-60'">Marriage Status Entry</button>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
