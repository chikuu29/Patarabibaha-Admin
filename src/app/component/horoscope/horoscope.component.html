<div class="row">
  <div class="col-xl-12 order-lg-1 order-xl-1">
      <div class="table-holder kt-portlet kt-portlet--height-fluid  ">
          <div class="table-caption-holder">
              <div class="dropdown-container">
                  <select id="dropdown" (change)="changepaginetdata($event)">
                      <option *ngFor="let option of options" [value]="option">{{ option }}</option>
                  </select>
              </div>

              <div class="kt-portlet__head-toolbar">


                  <app-search (getSerachText)="getSearchText($event)" [search_btn]="true" [fillter_btn]="false"
                      (clickSearch)="search($event)" (clickFillter)="fillter($event)"></app-search>
              </div>
          </div>
          <div class="table-content-holder kt-portlet__body kt-portlet__body--fit ps ps--active-y"
              id="grid_scroll_body" style="max-height: 75vh; position: relative;">
              <div class="inbox-body inbox-body-table">
                  <div class="table-scroll">
                      <table class="custom-table table  table-bordered table-striped">
                          <thead class="flip-content">
                              <tr>
                                  <th style="cursor: pointer;width:10%" title="Member Name">
                                    Profile View By</th>
                                  <th style="cursor: pointer; width:25%" title="Profile ID">
                                    Viewed Profile Id </th>
                                  <th style="cursor: pointer; width:25%" title="Created At">
                                      Created At
                                  </th>
                                  <th style="cursor: pointer; width: 145px;" title="Profile Status"> Profile Status
                                  </th>

                                  <!-- class="fixed-column" -->
                              </tr>
                          </thead>
                          <tbody>
                              <ng-container
                                  *ngFor="let data of tableData | fillter:['.profile_view_by_profile_id','profile_view_by_name','viewed_profile_id','viewed_profile_name']:filterText ; index as i">
                                  <tr>
                                      <td [title]="data.profile_view_by_profile_id"> {{data.profile_view_by_profile_id }}</td>
                                      <td [title]="data?.viewed_profile_id">
                                          <div> {{data?.viewed_profile_id}} </div>
                                      </td>
                                      <td title="Due In 9 Days ">
                                          <div class="btn btn-bold btn-sm btn-font-sm btn-label-danger dueLabel">
                                              {{data.created_At | date:'medium'}}
                                          </div>
                                      </td>
                                      <td [title]="data.user_dob | age">
                                          <div class="btn btn-bold btn-sm btn-font-sm btn-label-success dueLabel">
                                              {{ data.viewed_horoscope_reason }}
                                          </div>
                                      </td>


                                      <!-- <td> -->
                                          <!-- class="fixed-column" -->
                                          <!-- View Button with Outline Style -->
                                          <!-- <button class="btn btn-outline-primary btn-sm me-2" title="View"
                                              [routerLink]="'/user/'+data.user_id">
                                              <i class="fas fa-eye"></i> View
                                          </button> -->
                                          <!-- Open in New Tab Button with Outline Style -->
                                          <!-- <button class="btn btn-outline-primary btn-sm" title="Open in new tab"
                                             >
                                              <i class="fas fa-external-link-alt"></i> View Plan
                                          </button> -->

                                      <!-- </td> -->
                                  </tr>
                              </ng-container>


                          </tbody>
                      </table>
                  </div>

              </div>

          </div>
          <div class="table-footer-holder">
              <div>
                  <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" [maxSize]="10" [rotate]="false"
                      [ellipses]="false" [boundaryLinks]="false" class=""
                      (pageChange)="onpageChnage()"></ngb-pagination>
              </div>
              <div>
                  <span style="white-space: nowrap; padding-right: 20px;font-weight: bold;">Showing Record's
                      {{offset}} to {{totalFetchrecord}} of
                      {{totalDataCount}}</span>
              </div>

          </div>
      </div>
  </div>
</div>
