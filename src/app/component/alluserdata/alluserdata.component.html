<div class="">
    <div class="table-holder">
        <div class="caption-header">
            <div class="caption-item">
                <i class="fa-solid fa-chart-simple me-2 text-primary fs-5"></i>
                <span class="fs-5">Showing  of results</span>
                <!-- countryalldata.length {{}} -->
                <!-- {{countryalldata.length}}  -->

            </div>
            <div class="caption-item">
                <button pButton pRipple type="button" icon="pi pi-search" label="Find" class="me-2"></button>

            </div>
        </div>
        <div class="mt-3 data-view-container">
            <table class="table ">
                <thead class="table-header">
                    <tr>
                        <th class="width"></th>
                        <th >#SI</th>
                        <th >User Name</th>
                        <th >Created At</th>
                        <th >Approval</th>
                        <th>Delete Status</th>
                        <th >Action</th>
                    </tr>
                </thead>
                <tbody class="table-body table-striped">
                    <ng-container *ngFor="let data of alldata ; index as i">
                        <tr>
                            <td class="width">
                                <p class="badge badge-success" *ngIf="data.status == 1">
                                    <span></span>
                                </p>
                                <p class="badge badge-danger" *ngIf="data.status == 0">
                                    <span></span>
                                </p>
                            </td>
                            <td>{{i+1}}</td>
                            <td>{{data.user_fname+' '+data.user_lname }}</td>
                            <td>{{data.user_creation_date_time | date}}</td>
                            <td>
                                <p class="badge badge-success" *ngIf="data.user_status == 'Approved'">Approved</p>
                                <p class="badge badge-danger" *ngIf="data.user_status == 'Pending'">Pending</p>
                            </td>
                            <td>
                                <p class="badge badge-success" *ngIf="data.deleted == 1">Not Deleted</p>
                                <p class="badge badge-danger" *ngIf="data.deleted == 0">Deleted</p>
                            </td>
                            <td>
                                    <i (click)="deletedata(data.user_id,data.deleted)" [class]="data.deleted==1 ? 'material-icons text-danger pointer':'material-icons text-success pointer'">delete_outline</i>
                                    <i *ngIf="data.status == 0" (click)="publishuser(data.user_id)" class="material-icons pointer text-success">published_with_changes</i>
                                    <i *ngIf="data.status == 1" (click)="unpublishuser(data.user_id)" class="material-icons text-danger pointer">unpublished</i>
                                    <i (click)="userpage(data.user_id)" class="material-icons pointer text-primary" >approval</i>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </div>
</div>
