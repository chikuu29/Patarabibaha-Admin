<div class="show">
 <span>TOTAL:</span><span>{{ total }}</span>
</div>
<button (click)="downloadExcel()">Download Excel</button>

<div class="">
    <div class="table-holder">
        <div class="caption-header">
            <div class="caption-item">
                <i class="fa-solid fa-chart-simple me-2 text-primary fs-5"></i>
                <span class="fs-5">Showing {{finaldata?.length}} of {{finaldata?.length}} results</span>
            </div>

        </div>
        <div class="mt-3 data-view-container">
            <table class="table ">
                <thead class="table-header">
                    <tr>
                        <th>#SI</th>
                        <th>Date Transaction</th>
                        <th>Amount of Transaction</th>
                        <th>Mode of Transaction</th>
                        <th>Plan Type</th>
                        <!-- <th>Mobile no</th>
                        <th>Created At</th>
                        <th>Plan last date</th>
                        <th>Action</th> -->
                    </tr>
                </thead>
                <tbody class="table-body table-striped">
                    <ng-container
                        *ngFor="let data of finaldata | fillter:['user_fname','user_id','user_email','auth_phone_no']:filterText ; index as i">
                        <tr>
                            <td>{{i+1}}</td>
                            <td>{{data.plan_stating_date | date }}</td>
                            <td>{{data.membership_plan_amount }}</td>
                            <td>{{data.planactiveted_mode }}</td>
                            <td>{{data.membership_plan_type }}</td>
                            <!-- <td>{{data.user_creation_date_time | date}}</td>
                            <td>{{data.plan_stating_date | date}}</td>
                           <td>
                            <i class="material-icons text-danger pointer"
                            *ngIf="data.online_status == 0">close</i>
                           </td> -->
                           <!-- (click)="makeonline(data.user_id)" -->



                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </div>
</div>
